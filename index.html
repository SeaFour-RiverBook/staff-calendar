<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fa">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>和縁の里 カレンダー</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #263445; --muted: #718096; --line: #e4e9ef;
      --hour-line: #cbd5df; --brand: #356b91; --slot-height: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7fa; color: var(--ink); }
    .app { max-width: 1800px; margin: 0 auto; padding: 22px 24px 30px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    h1 { display: flex; align-items: center; gap: 9px; margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .02em; }\n    h1 img { display: block; width: 20px; height: 20px; flex: 0 0 20px; object-fit: contain; }
    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    button { border: 1px solid #d5dde6; background: #fff; color: var(--ink); border-radius: 7px; padding: 8px 13px; font-size: 14px; cursor: pointer; }
    button:hover { background: #f0f5f9; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #9bc2df; outline-offset: 2px; }
    .today, .primary { color: #fff; background: var(--brand); border-color: var(--brand); }
    .today:hover, .primary:hover { background: #285775; }
    .date-picker-wrap { position: relative; }
    .date-label { min-width: 190px; text-align: center; font-size: 18px; font-weight: 650; }
    .date-trigger { border: 0; padding: 8px 10px; background: transparent; }
    .date-trigger:hover { background: #eaf1f6; }
    .month-popup { position: absolute; top: calc(100% + 8px); right: 0; z-index: 15; display: none; width: 286px; padding: 14px; border: 1px solid #dce3eb; border-radius: 10px; background: #fff; box-shadow: 0 8px 28px #20364d26; }
    .month-popup.open { display: block; }
    .month-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .month-heading strong { font-size: 15px; }
    .month-heading button { padding: 5px 9px; }
    .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
    .month-weekday { padding: 5px 0; color: var(--muted); font-size: 11px; }
    .month-day { min-width: 0; padding: 7px 0; border: 0; border-radius: 50%; font-size: 12px; }
    .month-day.outside { color: #b4bdc7; }
    .month-day.selected { color: #fff; background: var(--brand); }
    .month-day.today-mark:not(.selected) { color: var(--brand); font-weight: 750; box-shadow: inset 0 0 0 1px var(--brand); }
    .month-day:hover { background: #eaf1f6; }
    .month-day.selected:hover { background: #285775; }
    .hint { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
    .calendar-shell { overflow: auto; max-height: calc(100vh - 155px); min-height: 420px; border: 1px solid #dce3eb; border-radius: 10px; background: #fff; box-shadow: 0 2px 8px #23384d0a; }
    .calendar { display: grid; grid-template-columns: 58px repeat(10, minmax(112px, 1fr)); min-width: 1180px; }
    .corner, .staff-head { position: sticky; top: 0; z-index: 5; height: 54px; background: #f8fafc; border-bottom: 1px solid var(--line); }
    .corner { left: 0; z-index: 7; border-right: 1px solid var(--line); }
    .staff-head { display: flex; align-items: center; justify-content: center; padding: 6px; border-right: 1px solid var(--line); font-size: 14px; font-weight: 650; }
    .time-column { position: sticky; left: 0; z-index: 3; background: #fbfcfd; border-right: 1px solid var(--line); }
    .time-label { height: calc(var(--slot-height) * 4); padding: 0 7px; transform: translateY(-8px); color: var(--muted); text-align: right; font-size: 11px; white-space: nowrap; }
    .staff-track { position: relative; height: calc(var(--slot-height) * 48); border-right: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--slot-height) * 4 - 1px), var(--hour-line) calc(var(--slot-height) * 4 - 1px), var(--hour-line) calc(var(--slot-height) * 4)); }
    .staff-track:last-child { border-right: 0; }
    .staff-track { user-select: none; }
    .selection-preview { position: absolute; left: 2px; right: 2px; z-index: 3; border: 2px solid #2674ad; border-radius: 4px; background: #58a9e866; box-shadow: inset 0 0 0 1px #ffffff80; pointer-events: none; }
    .event { position: absolute; left: 3px; right: 3px; z-index: 2; overflow: hidden; border: 1px solid transparent; border-radius: 5px; padding: 3px 5px; text-align: left; font-size: 11px; line-height: 1.35; white-space: normal; }
    .event strong, .event span { display: block; overflow: hidden; text-overflow: ellipsis; }
    .event .event-time { font-size: 10px; opacity: .85; }
    .event.bath { background: #dff1fb; border-color: #a8d6ec; color: #174d6b; }
    .event.transport { background: #fff0d9; border-color: #f2d09a; color: #754b0a; }
    .event.visit { background: #e4f3e5; border-color: #b4dcb8; color: #285b2d; }
    .event.meeting { background: #eee7fb; border-color: #cbb9ee; color: #513a7d; }
    .event.other { background: #fce6ed; border-color: #edbdcc; color: #7c344b; }
    .bottom-note { padding: 12px 2px 0; color: var(--muted); font-size: 12px; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 16px; background: #17253680; }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(100%, 440px); max-height: 90vh; overflow: auto; padding: 22px; border-radius: 12px; background: #fff; box-shadow: 0 12px 40px #14223540; }
    .modal h2 { margin: 0 0 16px; font-size: 19px; }
    .field { display: grid; gap: 6px; margin: 12px 0; }
    .field label { font-size: 13px; font-weight: 650; }
    .field input, .field select, .field textarea { width: 100%; min-width: 0; padding: 9px 10px; border: 1px solid #cfd8e2; border-radius: 7px; background: #fff; color: var(--ink); font: inherit; }
    .time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-actions { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
    .modal-actions .spacer { flex: 1; }
    .delete { color: #a22b36; border-color: #e6b8bd; }
    @media (max-width: 700px) {
      .app { padding: 14px 10px 20px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .date-label { min-width: 0; font-size: 16px; }
      .calendar-shell { max-height: calc(100vh - 190px); }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1><img src="/favicon.svg" alt=""><span>和縁の里 カレンダー</span></h1>
      <div class="toolbar" aria-label="日付操作">
        <button id="prevDay" type="button" aria-label="前の日">‹ 前日</button>
        <button id="today" class="today" type="button">今日</button>
        <button id="nextDay" type="button" aria-label="次の日">翌日 ›</button>
        <div class="date-picker-wrap" id="datePickerWrap">
          <button id="dateLabel" class="date-label date-trigger" type="button" aria-haspopup="dialog" aria-expanded="false"></button>
          <div id="monthPopup" class="month-popup" role="dialog" aria-label="日付を選択">
            <div class="month-heading"><button id="prevMonth" type="button" aria-label="前の月">‹</button><strong id="monthTitle"></strong><button id="nextMonth" type="button" aria-label="次の月">›</button></div>
            <div id="monthGrid" class="month-grid"></div>
          </div>
        </div>
      </div>
    </header>
    <p class="hint">全スタッフ表示 ／ 15分単位 ／ 表示時間 8:00〜20:00 ／ 空き枠をドラッグして時間を指定、クリックでも予定を追加</p>
    <section class="calendar-shell" aria-label="スタッフ別スケジュール">
      <div id="calendar" class="calendar"><div class="corner"></div></div>
    </section>
    <p class="bottom-note">※ 試作版：予定はこのブラウザ内に保存されます。別の端末とはまだ共有されません。</p>
  </main>

  <div id="modalBackdrop" class="modal-backdrop" role="presentation">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">予定を登録</h2>
      <form id="eventForm">
        <div class="field">
          <label for="eventTitle">予定名</label>
          <input id="eventTitle" maxlength="40" required placeholder="例：入浴介助">
        </div>
        <div class="field">
          <label for="eventStaff">スタッフ</label>
          <select id="eventStaff"></select>
        </div>
        <div class="time-row">
          <div class="field">
            <label for="eventStart">開始時刻</label>
            <input id="eventStart" type="time" min="08:00" max="19:45" step="900" required>
          </div>
          <div class="field">
            <label for="eventEnd">終了時刻</label>
            <input id="eventEnd" type="time" min="08:15" max="20:00" step="900" required>
          </div>
        </div>
        <div class="field">
          <label for="eventCategory">予定の種類・色</label>
          <select id="eventCategory">
            <option value="bath">入浴</option>
            <option value="transport">送迎</option>
            <option value="visit">訪問</option>
            <option value="meeting">会議</option>
            <option value="other">その他</option>
          </select>
        </div>
        <div class="field">
          <label for="eventMemo">メモ（50文字以内）</label>
          <textarea id="eventMemo" maxlength="50" rows="2" placeholder="必要に応じて入力"></textarea>
        </div>
        <div class="modal-actions">
          <button id="deleteEvent" class="delete" type="button" hidden>削除</button>
          <span class="spacer"></span>
          <button id="cancelModal" type="button">キャンセル</button>
          <button class="primary" type="submit">保存</button>
        </div>
      </form>
    </section>
  </div>

  <script>
    const staffMembers = Array.from({ length: 10 }, (_, i) => `スタッフ${i + 1}`);
    const calendar = document.getElementById("calendar");
    const dateLabel = document.getElementById("dateLabel");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const eventForm = document.getElementById("eventForm");
    const staffSelect = document.getElementById("eventStaff");
    let currentDate = new Date();
    currentDate.setHours(0, 0, 0, 0);
    let editingId = null;
    let displayedMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);

    for (const name of staffMembers) {
      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      staffSelect.appendChild(option);
    }

    function dateKey() {
      return [currentDate.getFullYear(), String(currentDate.getMonth() + 1).padStart(2, "0"), String(currentDate.getDate()).padStart(2, "0")].join("-");
    }
    function loadEvents() {
      try { return JSON.parse(localStorage.getItem("staff-calendar-" + dateKey()) || "[]"); }
      catch { return []; }
    }
    function saveEvents(events) {
      localStorage.setItem("staff-calendar-" + dateKey(), JSON.stringify(events));
    }
    function toMinutes(value) {
      const [h, m] = value.split(":").map(Number);
      return h * 60 + m;
    }
    function formatTime(value) {
      return value;
    }

    function renderCalendar() {
      calendar.replaceChildren();
      const corner = document.createElement("div");
      corner.className = "corner";
      calendar.appendChild(corner);

      for (const name of staffMembers) {
        const head = document.createElement("div");
        head.className = "staff-head";
        head.textContent = name;
        calendar.appendChild(head);
      }

      const timeColumn = document.createElement("div");
      timeColumn.className = "time-column";
      for (let hour = 8; hour < 20; hour++) {
        const label = document.createElement("div");
        label.className = "time-label";
        label.textContent = `${String(hour).padStart(2, "0")}:00`;
        timeColumn.appendChild(label);
      }
      calendar.appendChild(timeColumn);

      const events = loadEvents();
      for (const name of staffMembers) {
        const track = document.createElement("div");
        track.className = "staff-track";
        track.setAttribute("aria-label", `${name}の予定欄`);
        let dragState = null;
        let selectionPreview = null;

        function slotAt(clientY) {
          const rect = track.getBoundingClientRect();
          const y = Math.max(0, Math.min(959, clientY - rect.top));
          return Math.max(0, Math.min(47, Math.floor(y / 20)));
        }

        function updateSelection(currentSlot) {
          if (!dragState) return;
          dragState.currentSlot = currentSlot;
          const first = Math.min(dragState.startSlot, currentSlot);
          const last = Math.max(dragState.startSlot, currentSlot);
          selectionPreview.style.top = (first * 20) + "px";
          selectionPreview.style.height = ((last - first + 1) * 20 - 2) + "px";
        }

        track.addEventListener("pointerdown", (event) => {
          if (event.button !== 0 || event.target.closest(".event")) return;
          const startSlot = slotAt(event.clientY);
          dragState = { startSlot, currentSlot: startSlot, moved: false };
          selectionPreview = document.createElement("div");
          selectionPreview.className = "selection-preview";
          track.appendChild(selectionPreview);
          updateSelection(startSlot);
          track.setPointerCapture(event.pointerId);
        });

        track.addEventListener("pointermove", (event) => {
          if (!dragState) return;
          const currentSlot = slotAt(event.clientY);
          if (currentSlot !== dragState.startSlot) dragState.moved = true;
          updateSelection(currentSlot);
        });

        track.addEventListener("pointerup", (event) => {
          if (!dragState) return;
          const state = dragState;
          const endSlot = slotAt(event.clientY);
          dragState = null;
          if (selectionPreview) selectionPreview.remove();
          selectionPreview = null;

          const first = state.moved ? Math.min(state.startSlot, endSlot) : state.startSlot;
          const lastExclusive = state.moved ? Math.max(state.startSlot, endSlot) + 1 : Math.min(state.startSlot + 4, 48);
          const start = 8 * 60 + first * 15;
          const end = 8 * 60 + lastExclusive * 15;
          openModal({
            staff: name,
            start: minutesToTime(start),
            end: minutesToTime(end),
            category: "other",
            memo: ""
          });
        });

        track.addEventListener("pointercancel", () => {
          dragState = null;
          if (selectionPreview) selectionPreview.remove();
          selectionPreview = null;
        });

        for (const item of events.filter(item => item.staff === name)) {
          const start = toMinutes(item.start);
          const end = toMinutes(item.end);
          const block = document.createElement("button");
          block.type = "button";
          block.className = `event ${item.category}`;
          block.style.top = ((start - 480) / 15 * 20) + "px";
          block.style.height = Math.max(20, (end - start) / 15 * 20 - 2) + "px";
          const title = document.createElement("strong");
          title.textContent = item.title;
          const time = document.createElement("span");
          time.className = "event-time";
          time.textContent = `${item.start}〜${item.end}`;
          block.append(title, time);
          if (item.memo) {
            const memo = document.createElement("span");
            memo.textContent = item.memo;
            block.appendChild(memo);
          }
          block.addEventListener("click", (event) => {
            event.stopPropagation();
            openModal(item);
          });
          track.appendChild(block);
        }
        calendar.appendChild(track);
      }

      dateLabel.textContent = new Intl.DateTimeFormat("ja-JP", {
        year: "numeric", month: "long", day: "numeric", weekday: "short"
      }).format(currentDate);
      renderMonthPicker();
    }


    function renderMonthPicker() {
      const grid = document.getElementById("monthGrid");
      const year = displayedMonth.getFullYear();
      const month = displayedMonth.getMonth();
      document.getElementById("monthTitle").textContent = new Intl.DateTimeFormat("ja-JP", { year: "numeric", month: "long" }).format(displayedMonth);
      grid.replaceChildren();
      for (const day of ["月", "火", "水", "木", "金", "土", "日"]) {
        const label = document.createElement("div");
        label.className = "month-weekday";
        label.textContent = day;
        grid.appendChild(label);
      }
      const first = new Date(year, month, 1);
      const offset = (first.getDay() + 6) % 7;
      const gridStart = new Date(year, month, 1 - offset);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      for (let i = 0; i < 42; i++) {
        const date = new Date(gridStart);
        date.setDate(gridStart.getDate() + i);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "month-day";
        button.textContent = date.getDate();
        if (date.getMonth() !== month) button.classList.add("outside");
        if (date.getTime() === currentDate.getTime()) button.classList.add("selected");
        if (date.getTime() === today.getTime()) button.classList.add("today-mark");
        button.addEventListener("click", () => {
          currentDate = new Date(date);
          currentDate.setHours(0, 0, 0, 0);
          closeMonthPicker();
          renderCalendar();
        });
        grid.appendChild(button);
      }
    }
    function openMonthPicker() {
      displayedMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
      renderMonthPicker();
      document.getElementById("monthPopup").classList.add("open");
      dateLabel.setAttribute("aria-expanded", "true");
    }
    function closeMonthPicker() {
      document.getElementById("monthPopup").classList.remove("open");
      dateLabel.setAttribute("aria-expanded", "false");
    }

    function minutesToTime(minutes) {
      return String(Math.floor(minutes / 60)).padStart(2, "0") + ":" + String(minutes % 60).padStart(2, "0");
    }

    function openModal(item = {}) {
      editingId = item.id || null;
      document.getElementById("modalTitle").textContent = editingId ? "予定を編集" : "予定を登録";
      document.getElementById("eventTitle").value = item.title || "";
      staffSelect.value = item.staff || staffMembers[0];
      document.getElementById("eventStart").value = item.start || "08:00";
      document.getElementById("eventEnd").value = item.end || "09:00";
      document.getElementById("eventCategory").value = item.category || "other";
      document.getElementById("eventMemo").value = item.memo || "";
      document.getElementById("deleteEvent").hidden = !editingId;
      modalBackdrop.classList.add("open");
      document.getElementById("eventTitle").focus();
    }

    function closeModal() {
      modalBackdrop.classList.remove("open");
      editingId = null;
    }

    eventForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const title = document.getElementById("eventTitle").value.trim();
      const start = document.getElementById("eventStart").value;
      const end = document.getElementById("eventEnd").value;
      const startMinutes = toMinutes(start);
      const endMinutes = toMinutes(end);
      if (!title) return;
      if (startMinutes < 480 || endMinutes > 1200 || startMinutes % 15 || endMinutes % 15 || endMinutes <= startMinutes) {
        alert("時刻は8:00〜20:00の範囲で、15分単位かつ終了時刻が開始時刻より後になるように設定してください。");
        return;
      }
      const events = loadEvents();
      const item = {
        id: editingId || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
        title,
        staff: staffSelect.value,
        start, end,
        category: document.getElementById("eventCategory").value,
        memo: document.getElementById("eventMemo").value.trim()
      };
      const index = events.findIndex(event => event.id === editingId);
      if (index >= 0) events[index] = item;
      else events.push(item);
      saveEvents(events);
      closeModal();
      renderCalendar();
    });

    document.getElementById("deleteEvent").addEventListener("click", () => {
      if (!editingId || !confirm("この予定を削除しますか？")) return;
      saveEvents(loadEvents().filter(item => item.id !== editingId));
      closeModal();
      renderCalendar();
    });
    document.getElementById("cancelModal").addEventListener("click", closeModal);
    modalBackdrop.addEventListener("click", (event) => {
      if (event.target === modalBackdrop) closeModal();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeModal();
    });

    function moveDate(days) {
      currentDate.setDate(currentDate.getDate() + days);
      renderCalendar();
    }
    dateLabel.addEventListener("click", () => {
      if (document.getElementById("monthPopup").classList.contains("open")) closeMonthPicker();
      else openMonthPicker();
    });
    document.getElementById("prevMonth").addEventListener("click", () => { displayedMonth.setMonth(displayedMonth.getMonth() - 1); renderMonthPicker(); });
    document.getElementById("nextMonth").addEventListener("click", () => { displayedMonth.setMonth(displayedMonth.getMonth() + 1); renderMonthPicker(); });
    document.addEventListener("click", (event) => { if (!event.target.closest("#datePickerWrap")) closeMonthPicker(); });

    document.getElementById("prevDay").addEventListener("click", () => moveDate(-1));
    document.getElementById("nextDay").addEventListener("click", () => moveDate(1));
    document.getElementById("today").addEventListener("click", () => {
      currentDate = new Date();
      currentDate.setHours(0, 0, 0, 0);
      renderCalendar();
    });

    renderCalendar();
  </script>
</body>
</html>
